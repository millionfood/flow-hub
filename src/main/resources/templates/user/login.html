<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Flow-Hub | 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 450px; margin-top: 80px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container shadow p-4 rounded bg-white">
    <h2 class="mb-4 text-center">Flow-Hub 로그인</h2>

    <!-- 일반적인 Spring Security 사용 시 action은 /login, 아니라면 Custom URL로 지정 -->
    <form th:action="@{/user/login}" method="post">

        <!-- 로그인 실패 메시지 처리 -->
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}">이메일 또는 비밀번호가 올바르지 않습니다.</span>
        </div>
        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            <span>이메일 또는 비밀번호를 다시 확인해주세요.</span>
        </div>

        <!-- 이메일 입력 -->
        <div class="mb-3">
            <label for="username" class="form-label">이메일</label>
            <input type="email" name="username" id="username" class="form-control" placeholder="example@flowhub.com" required rows="1">
        </div>

        <!-- 비밀번호 입력 -->
        <div class="mb-4">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-success">로그인</button>
            <a th:href="@{/user/join}" class="btn btn-outline-secondary">신규 회원가입</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

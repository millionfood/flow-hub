<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"> <!-- ◀ 시큐리티 태그 라이브러리 추가 -->
<head>
    <meta charset="UTF-8">
    <title>Flow-Hub | 마이페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 600px; margin-top: 60px; }
        .profile-card { border-radius: 15px; }
    </style>
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="card profile-card shadow p-4 bg-white">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
            <h2>마이페이지</h2>
            <!-- 유저 권한 뱃지 표시 -->
            <span th:text="${user.role}"
                  th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger' : 'bg-primary'"
                  class="badge fs-6">USER</span>
        </div>

        <!-- 공통 회원 정보 섹션 -->
        <div class="row mb-3">
            <div class="col-sm-3 text-muted">이름</div>
            <div class="col-sm-9 fw-bold" th:text="${user.name}">안진혁</div>
        </div>
        <div class="row mb-3">
            <div class="col-sm-3 text-muted">이메일 계정</div>
            <div class="col-sm-9" th:text="${user.email}">example@flowhub.com</div>
        </div>
        <div class="row mb-4">
            <div class="col-sm-3 text-muted">계정 상태</div>
            <div class="col-sm-9">
                <span class="text-success fw-bold" th:if="${user.useYn.name() == 'Y'}">정상 사용 중</span>
                <span class="text-danger fw-bold" th:if="${user.useYn.name() == 'N'}">정지/휴면 계정</span>
            </div>
        </div>

        <!-- 👑 관리자(ADMIN) 전용 특별 섹션 -->
        <!-- 컨트롤러에서 넘겨준 UserRole 값이 ADMIN이거나 시큐리티 권한이 ROLE_ADMIN일 때만 노출됩니다. -->
        <div th:if="${user.role.name() == 'ADMIN'}" class="alert alert-warning border-warning my-4">
            <h5 class="alert-heading fw-bold">⚙️ 관리자 전용 마스터 콘솔</h5>
            <p class="small text-muted mb-3">전체 회원 관리 및 시스템 설정을 제어할 수 있는 권한이 있습니다.</p>
            <div class="d-flex gap-2">
                <a th:href="@{/admin/users}" class="btn btn-sm btn-dark">전체 회원 관리</a>
                <a th:href="@{/admin/settings}" class="btn btn-sm btn-outline-dark">시스템 로그 조회</a>
            </div>
        </div>

        <!-- 하단 공통 액션 버튼 -->
        <div class="d-flex justify-content-end gap-2 border-top pt-3">
            <a th:href="@{/}" class="btn btn-secondary">메인으로</a>
            <a th:href="@{/user/edit}" class="btn btn-success">정보 수정</a>
            <form th:action="@{/user/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-danger">로그아웃</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Flow-Hub | 정보 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 600px; margin-top: 60px; }
        .edit-card { border-radius: 15px; }
    </style>
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="card edit-card shadow p-4 bg-white">
        <h2 class="mb-4 border-bottom pb-2">회원 정보 수정</h2>

        <!-- 수정 폼 -->
        <form th:action="@{/user/edit}" method="post" id="modify-form">
            <div class="mb-3">
                <label class="form-label text-muted">이메일 계정 (변경 불가)</label>
                <!-- 이메일은 중복 및 시스템 식별자이므로 수정 불가(readonly) 처리 -->
                <input type="email" class="form-control bg-transparent" th:value="${user.email}" readonly>
            </div>

            <div class="mb-3">
                <label for="name" class="form-label fw-bold">이름</label>
                <!-- 컨트롤러에서 넘겨준 기존 이름이 th:value로 세팅됩니다 -->
                <input type="text" id="name" name="name" class="form-control" th:value="${user.name}" required>
            </div>

            <div class="mb-3">
                <label for="name" class="form-label fw-bold">연락처</label>
                <!-- 컨트롤러에서 넘겨준 기존 이름이 th:value로 세팅됩니다 -->
                <input type="text" id="tel" name="tel" class="form-control" th:value="${user.tel}" required>
            </div>


            <div class="mb-3">
                <label for="password" class="form-label fw-bold">새 비밀번호 (변경 시에만 입력)</label>
                <!-- 서비스 단에서 빈 값 검사를 하므로, 바꾸고 싶을 때만 입력하도록 가이드합니다 -->
                <input type="password" id="password" name="password" class="form-control" placeholder="변경할 새 비밀번호를 입력하세요">
            </div>

            <div class="mb-1">
                <label for="password" class="form-label fw-bold">새 비밀번호 확인(변경 시에만 입력)</label>
                <!-- 서비스 단에서 빈 값 검사를 하므로, 바꾸고 싶을 때만 입력하도록 가이드합니다 -->
                <input type="password" id="passwordCheck" name="passwordCheck" class="form-control" placeholder="비밀번호 확인">
            </div>
            <div id="password-feedback" class="small fw-bold mb-"></div>

            <div class="d-flex justify-content-between border-top pt-3">
                <!-- 🚨 회원 탈퇴 버튼 (클릭 시 자바스크립트 함수 호출) -->
                <button type="button" class="btn btn-outline-danger" onclick="confirmDelete()">회원 탈퇴</button>

                <div class="d-flex gap-2">
                    <a th:href="@{/user/detail}" class="btn btn-secondary">취소</a>
                    <button type="submit" class="btn btn-success">수정 완료</button>
                </div>
            </div>
        </form>

        <!-- 🚨 탈퇴 처리용 숨김 POST 폼 (GET 방식의 탈퇴는 보안상 위험하므로 무조건 POST 전송) -->
        <form id="deleteForm" th:action="@{/user/delete}" method="post" style="display: none;"></form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const passwordInput = document.getElementById('password');
        const passwordCheckInput = document.getElementById('passwordCheck');
        const feedback = document.getElementById('password-feedback');
        const modifyForm = document.getElementById('modify-form');


        function checkPasswordMatch() {
            const password = passwordInput.value;
            const passwordCheck = passwordCheckInput.value;

            // 둘 다 입력 안 한 경우 (비밀번호 변경 의사가 없는 경우) -> 메시지 지우고 통과
            if (!password && !passwordCheck) {
                feedback.innerText = '';
                feedback.className = '';
                return true;
            }

            // 비밀번호가 서로 일치하는 경우
            if (password === passwordCheck) {
                feedback.innerText = '✓ 비밀번호가 일치합니다.';
                feedback.className = 'small fw-bold mb-4 text-success';
                return true;
            }
            // 일치하지 않는 경우
            else {
                feedback.innerText = '✗ 비밀번호가 일치하지 않습니다.';
                feedback.className = 'small fw-bold mb-4 text-danger';
                return false;
            }
        }

        passwordInput.addEventListener('input', checkPasswordMatch);
        passwordCheckInput.addEventListener('input', checkPasswordMatch);

        modifyForm.addEventListener('submit', function(e) {
            const telInput = document.getElementById('tel');
            const telRegex = (/^\d{11}$/);
            if(!telRegex.test(telInput.value)) {
                e.preventDefault();
                alert("올바른 전화번호 11자리를 입력해 주세요");
                telInput.focus();
                return;
            }
            // 실시간 검증 결과가 false(불일치) 상태라면?
            if (!checkPasswordMatch()) {
                e.preventDefault(); //
                alert('변경할 새 비밀번호가 서로 일치하지 않습니다. 다시 확인해 주세요.');
                passwordCheckInput.focus(); // 비밀번호 확인 칸으로 포커스 강제 이동
            }
        });

        function confirmDelete() {
            if (confirm("정말로 탈퇴하시겠습니까?\n탈퇴 시 계정이 즉시 비활성화되며 로그인이 불가능합니다.")) {
                document.getElementById('deleteForm').submit();
            }
        }
    })

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>재고 입고 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="py-5 text-center">
        <h2>창고 목록</h2>
    </div>

    <div class="row">
        <div class="col">
            <button class="btn btn-primary float-end"
                    th:onclick="|location.href='@{/warehouses/new}'|" type="button">창고 등록</button>
        </div>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>#</th>
            <th>창고명</th>
            <th>위치</th>
            <th>연락처</th>
            <th>관리자</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="warehouse : ${warehouses}">
            <td th:text="${warehouse.id}">1</td>
            <td><a th:href="@{/warehouses/detail/{id}(id=${warehouse.id})}" th:text="${warehouse.name}">제1창고</a></td>
            <td th:text="${warehouse.address}">서울시...</td>
            <td th:text="${warehouse.tel}">02-123-4567</td>
            <td th:text="${warehouse.managerName}">홍길동</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

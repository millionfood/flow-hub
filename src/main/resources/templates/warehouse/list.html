<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>창고 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">

    <div class="py-5 text-center">
        <h2>🏭 창고 현황 목록</h2>
    </div>

    <!-- 검색 필터 (선택 사항) -->
    <div class="filter-section" style="margin-bottom: 20px;">
        <form th:action="@{/warehouses/list}" method="get" class="form-inline">
            <input type="text" name="itemName" placeholder="창고명 검색" class="form-control mb-3">
            <button type="submit" class="btn btn-secondary">검색</button>
        </form>
    </div>

    <div class="row">
        <div class="col">
            <button class="btn btn-primary float-end"
                    th:onclick="|location.href='@{/warehouses/new}'|" type="button">창고 등록</button>
        </div>
    </div>

    <table class="table table-hover border">
        <thead class="table-light">
        <tr>
            <th>No.</th>
            <th>창고명</th>
            <th>위치</th>
            <th>연락처</th>
            <th>관리자</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <!-- 데이터가 없는 경우 -->
        <tr th:if="${#lists.isEmpty(warehouses)}">
            <td colspan="6" class="text-center text-muted">등록된 로케이션이 없습니다.</td>
        </tr>
        <tr th:each="warehouse : ${warehouses}">
            <td th:text="${warehouse.id}">1</td>
            <td><span class="badge bg-info text-dark" th:text="${warehouse.name}">제1창고</span></td>
            <td th:text="${warehouse.address}">서울시...</td>
            <td th:text="${warehouse.tel}">02-123-4567</td>
            <td th:text="${warehouse.managerName}" class="text-success">홍길동</td>
            <td>
                <a th:href="@{/warehouses/detail/{id}(id=${warehouse.id})}" class="btn btn-sm btn-outline-secondary">상세정보</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

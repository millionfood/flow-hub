<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>창고 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-5">

    <!-- 🎛️ 상단 물류 통합 대시보드 탭 -->
    <div class="card p-2 mb-4 shadow-sm bg-white">
        <ul class="nav nav-pills nav-fill">
            <li class="nav-item"><a class="nav-link active bg-dark" th:href="@{/warehouses/list}">🏢 사용가능 창고 조회</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/location/list}">📍 로케이션(랙) 현황</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/items/list}">📦 등록가능 상품 조회</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/stocks/list}">📜 재고 조회 및 등록</a></li>
        </ul>
    </div>

    <div class="py-5 text-center">
        <h2>🏭 창고 현황 목록</h2>
    </div>

    <!-- 검색 필터 (선택 사항) -->
    <div class="card shadow-sm bg-white p-3 mb-4">
        <form th:action="@{/warehouses/list}" method="get" id="search-form" class="row g-3 align-items-center">
            <!-- 3. 창고 식별 정보 검색 -->
            <div class="col-md-5">
                <label class="form-label small fw-bold text-secondary">창고명</label>
                <input type="text" th:field="${cond.warehouseSearch}"  class="form-control form-control-sm" placeholder="창고 이름 입력">
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold text-secondary">관리자 이름</label>
                <input type="text" th:field="${cond.adminName}"  class="form-control form-control-sm" placeholder="관리자 이름 입력">
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold text-secondary">관리자 연락처</label>
                <input type="text" th:field="${cond.adminTel}"  class="form-control form-control-sm" placeholder="관리자 연락처 입력">
            </div>

            <div class="col-md-1 align-self-end">
                <button type="submit" class="btn btn-dark btn-sm w-100 fw-bold">필터</button>
            </div>
        </form>
    </div>

    <div class="d-flex justify-content-end gap-2 mb-3">
        <button class="btn btn-secondary"
                onclick="history.back(); return false;" type="button">이전</button>
    </div>

    <table class="table table-hover border">
        <thead class="table-light">
        <tr>
            <th>No.</th>
            <th>창고명</th>
            <th>위치</th>
            <th>관리자</th>
            <th>연락처</th>
        </tr>
        </thead>
        <tbody>
        <!-- 데이터가 없는 경우 -->
        <tr th:if="${#lists.isEmpty(page.getContent())}">
            <td colspan="6" class="text-center text-muted">등록된 로케이션이 없습니다.</td>
        </tr>
        <tr th:each="warehouse : ${page.getContent()}">
            <td th:text="${warehouse.id}">1</td>
            <td th:text="${warehouse.name}" class="fw-bold">제1창고</td>
            <td th:text="${warehouse.address}">서울시...</td>
            <td th:text="${warehouse.registerName}" class="text-success">홍길동</td>
            <td th:text="${warehouse.registerTel}">02-123-4567</td>
        </tr>
        </tbody>
    </table>
    <div th:replace="~{fragments/navbar :: pagingBar(${page})}"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

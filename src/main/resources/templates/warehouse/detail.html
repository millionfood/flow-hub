<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>창고 정보 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="py-5 text-center">
        <h2>창고 상세 정보</h2>
    </div>

    <div class="mb-3">
        <label>창고 ID</label>
        <input type="text" th:value="${warehouseDetail.id}" class="form-control" readonly>
    </div>
    <div class="mb-3">
        <label>창고명</label>
        <input type="text" th:value="${warehouseDetail.name}" class="form-control" readonly>
    </div>
    <div class="mb-3">
        <label>주소</label>
        <input type="text" th:value="${warehouseDetail.address}" class="form-control" readonly>
    </div>
    <div class="mb-3">
        <label>연락처</label>
        <input type="text" th:value="${warehouseDetail.tel}" class="form-control" readonly>
    </div>
    <div class="mb-3">
        <label>관리자</label>
        <input type="text" th:value="${warehouseDetail.managerName}" class="form-control" readonly>
    </div>
    <div class="mb-3">
        <label>사용 여부</label>
        <input type="text" th:value="${warehouseDetail.useYn.description}" class="form-control" readonly>
    </div>

    <hr class="my-4">
    <div class="row">
        <div class="col">
            <button class="w-100 btn btn-primary btn-lg"
                    th:onclick="|location.href='@{/warehouses/edit/{id}(id=${warehouseDetail.id})}'|" type="button">수정</button>
        </div>
        <div class="col">
            <form th:action="@{/warehouses/delete/{id}(id=${warehouseDetail.id})}" method="post">
                <button class="w-100 btn btn-danger btn-lg" type="submit"
                        onclick="return confirm('정말 삭제하시겠습니까?')">삭제</button>
            </form>
        </div>
        <div class="col">
            <button class="w-100 btn btn-secondary btn-lg"
                    th:onclick="|location.href='@{/warehouses/list}'|" type="button">목록으로</button>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>재고 입고 등록</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">

  <div class="py-5 text-center">
    <h2>창고 정보 수정</h2>
  </div>

  <form th:action th:object="${warehouse}" method="post">
    <!-- ID는 필수 전송 -->
    <input type="hidden" th:field="${warehouseId}">

    <!-- 창고명 -->
    <div class="mb-3">
      <label th:for="name">창고명</label>
      <input type="text" th:field="*{name}" class="form-control"
             th:class="${#fields.hasErrors('name')} ? 'form-control field-error' : 'form-control'">
      <div class="text-danger" th:errors="*{name}">에러 메시지</div>
    </div>

    <!-- 주소 -->
    <div class="mb-3">
      <label th:for="address">주소</label>
      <input type="text" th:field="*{address}" class="form-control">
    </div>

    <!-- 관리자명 -->
    <div class="mb-3">
      <label th:for="managerName">관리자명(수정 불가)</label>
      <input type="text" th:field="*{register.name}" class="form-control" readonly>
    </div>

    <!-- 연락처 -->
    <div class="mb-3">
      <label th:for="tel">관리자 연락처(수정 불가)</label>
      <input type="text" th:field="*{register.tel}" class="form-control" readonly>
    </div>

    <!-- 현재 상태 (조회 전용) -->
    <div class="mb-3">
      <label>현재 상태</label>
      <div class="form-control bg-light">
        <span th:text="${useYn.description}">사용</span>
      </div>
      <small class="text-muted">* 상태 변경은 상세 페이지의 버튼을 이용해 주세요.</small>
    </div>

    <hr class="my-4">
    <div class="row">
      <div class="col">
        <button class="w-100 btn btn-primary btn-lg" type="submit">수정 완료</button>
      </div>
      <div class="col">
        <button class="w-100 btn btn-secondary btn-lg"
                onclick="history.back(); return false;" type="button">취소</button>
      </div>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

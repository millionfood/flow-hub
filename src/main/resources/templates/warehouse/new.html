<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>재고 입고 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">

    <div class="py-5 text-center">
        <h2>창고 등록</h2>
    </div>

    <form th:action="@{/admin/warehouse/new}" th:object="${warehouseForm}" method="post">
        <div class="mb-3">
            <label th:for="name">창고명</label>
            <input type="text" th:field="*{name}" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label th:for="address">주소</label>
            <input type="text" th:field="*{address}" class="form-control">
        </div>

        <div class="mb-3">
            <label th:for="managerName">관리자 이름</label>
            <input type="text" th:value="${user?.name}" class="form-control bg-light" readonly>
            <input type="hidden" name="registerId" th:value="${user?.id}">
        </div>

        <hr class="my-4">

        <div class="row">
            <div class="col">
                <button type="button" onclick="history.back()" class="w-100 btn btn-secondary btn-lg">이전으로</button>
            </div>
            <div class="col">
                <button type="submit" class="w-100 btn btn-primary btn-lg">등록</button>
            </div>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

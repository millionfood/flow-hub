<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>재고 입고 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h2>창고 등록</h2>

    <form th:action="@{/warehouses/new}" th:object="${warehouseForm}" method="post">
        <div class="mb-3">
            <label th:for="name">창고명</label>
            <input type="text" th:field="*{name}" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label th:for="address">주소</label>
            <input type="text" th:field="*{address}" class="form-control">
        </div>

        <div class="mb-3">
            <label th:for="managerName">관리자 이름</label>
            <input type="text" th:field="*{managerName}" class="form-control">
        </div>

        <div class="mb-3">
            <label th:for="tel">연락처</label>
            <input type="text" th:field="*{tel}" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">등록</button>
    </form>
</div>
</body>
</html>

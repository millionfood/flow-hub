<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>재고 이동</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <h2>🚚 재고 이동 (Stock Move)</h2>
    <p class="text-muted">재고의 일부 또는 전체를 다른 로케이션으로 이동합니다.</p>
    <hr>

    <form th:action th:object="${stockMoveDto}" method="post">
        <!-- 1. 출발지 정보 (수정 불가) -->
        <div class="card mb-4 source-box">
            <div class="card-body">
                <h5 class="card-title text-secondary">출발지 (Source)</h5>
                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label">현재 로케이션</label>
                        <input type="text" th:value="${stockDetailDto.locationLocCode}" class="form-control" readonly>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">상품명</label>
                        <input type="text" th:value="${stockDetailDto.itemName}" class="form-control" readonly>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">현재 수량</label>
                        <input type="text" id="maxQuantity" th:value="${stockDetailDto.quantity}" class="form-control" readonly>
                    </div>
                </div>
                <!-- 숨겨진 필드: 기존 재고 ID 및 상품 ID -->
                <input type="hidden" name="id" th:value="${stockDetailDto.id}">
                <input type="hidden" th:field="*{itemId}">
            </div>
        </div>

        <!-- 2. 이동 설정 -->
        <div class="card mb-4 dest-box shadow-sm">
            <div class="card-body">
                <h5 class="card-title text-success">이동 설정 (Target)</h5>

                <div class="row">
                    <!-- 목적지 선택 -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label font-weight-bold">목적지 로케이션</label>
                        <select th:field="*{toLocationId}" class="form-select" required>
                            <option value="">-- 목적지 선택 --</option>
                            <option th:each="loc : ${moveableLocations}"
                                    th:value="${loc.id}"
                                    th:text="${loc.locCode}"></option>
                        </select>
                        <small class="text-muted">※ 동일 상품만 적치 가능합니다.</small>
                    </div>

                    <!-- 이동 수량 입력 -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label font-weight-bold">이동할 수량</label>
                        <div class="input-group">
                            <input type="number" th:field="*{moveQuantity}" class="form-control"
                                   min="1" th:max="${stockDetailDto.quantity}" required>
                            <button class="btn btn-outline-secondary" type="button" onclick="selectAll()">전체 선택</button>
                        </div>
                        <p th:if="${#fields.hasErrors('moveQuantity')}" th:errors="*{moveQuantity}" class="text-danger"></p>
                        <small id="moveHelp" class="text-info">수량 전체 이동 시 기존 위치의 재고는 삭제됩니다.</small>
                    </div>
                </div>

                <div class="row">
                    <!-- 상태 정보 (변경 불가, 이동 시 유지) -->
                    <div class="col-md-6">
                        <label class="form-label">재고 상태</label>
                        <input type="text" th:value="${stockDetailDto.status.description}" class="form-control" readonly>
                        <input type="hidden" th:field="*{status}">
                        <small class="text-muted">※ 상태변경은 재고 수정을 이용해 주세요.</small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">이동 사유</label>
                        <input type="text" th:field="*{remark}" class="form-control">
                        <small class="text-muted">※ 상태변경은 재고 수정을 이용해 주세요.</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- 버튼 영역 -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success px-5">이동 확정</button>
            <a th:href="@{/stocks/list}" class="btn btn-secondary px-5">취소</a>
        </div>
    </form>
</div>

<script>
    // 전체 수량 선택 버튼 기능
    function selectAll() {
        const maxQty = document.getElementById('maxQuantity').value;
        document.getElementById('moveQuantity').value = maxQty;
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

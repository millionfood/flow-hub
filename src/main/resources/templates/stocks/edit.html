<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>재고 정보 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center">
        <h2>🛠️ 재고 정보 수정 (Adjustment)</h2>
        <!-- 삭제 버튼: 위험하므로 빨간색으로 표시 -->
        <!-- 실제 삭제를 수행할 숨겨진 폼 -->
        <form id="deleteForm" th:action="@{/stocks/delete/{id}(id=${stockDetailDto.id})}" method="post" style="display:none;">
            <!-- Spring Security 사용 시 CSRF 토큰 자동 삽입됨 -->
        </form>
        <button type="button" class="btn btn-danger" onclick="confirmDelete()">재고 완전히 삭제</button>
    </div>
    <hr>

    <form th:action th:object="${stockUpdateDto}" method="post">
        <!-- 수정 불가 항목 (읽기 전용) -->
        <div class="form-group mb-3">
            <label class="form-label">현재 로케이션</label>
            <input type="text" th:value="${stockDetailDto.locationLocCode}" class="form-control" readonly>
            <small class="text-muted">* 로케이션 이동은 '재고 이동' 메뉴를 이용하세요.</small>
        </div>

        <div class="form-group mb-3">
            <label class="form-label">상품 정보</label>
            <input type="text" th:value="'[' + ${stockDetailDto.itemName} + ']'"
                   class="form-control" readonly>
        </div>

        <hr>

        <!-- 수정 가능 항목 -->
        <div class="form-group mb-3">
            <label class="form-label">재고 수량</label>
            <input type="number" th:field="*{quantity}" class="form-control" min="0" required>
            <p th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}" class="text-danger"></p>
            <small class="text-info">실사 후 확인된 최종 수량을 입력하세요.</small>
        </div>

        <div class="form-group mb-3">
            <label class="form-label">재고 상태</label>
            <select th:field="*{status}" class="form-control">
                <option value="">====값을 선택하세요====</option>
                <option th:each="status : ${statusList}"
                        th:value="${status}"
                        th:text="${status.description}"></option>
            </select>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary">수정 완료</button>
            <a th:href="@{/stocks/list}" class="btn btn-secondary">취소</a>
        </div>
    </form>
</div>

<!-- 삭제 처리를 위한 스크립트 -->
<script>
    function confirmDelete() {
        if (confirm("정말로 이 재고 레코드를 삭제하시겠습니까?\n이 작업은 되돌릴 수 없으며 히스토리에서만 확인 가능합니다.")) {
            // 숨겨진 폼을 찾아 제출
            document.getElementById('deleteForm').submit();
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

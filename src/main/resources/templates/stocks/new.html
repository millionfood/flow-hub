<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>신규 재고 등록</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">

  <div class="py-5 text-center">
    <h2>신규 재고 등록</h2>
  </div>

  <form th:action="@{/stocks/new}" th:object="${stock}" method="post">

    <!-- 창고 선택 -->
    <div>
      <label class="form-label small fw-bold text-secondary">창고선택</label>
      <select id="warehouse-select" class="form-control" th:field="*{warehouseId}">
        <option value="">창고를 선택하세요</option>
        <option class="form-control" th:each="warehouse:${warehouses}"
                th:value="${warehouse.id}"
                th:text="${warehouse.name}"
        ></option>
      </select>
    </div>

    <!-- 상품 선택 -->
    <div>
      <label class="form-label small fw-bold text-secondary">상품</label>
      <select th:field="*{itemId}" id="item-select" class="form-control">
        <option value="">상품을 선택하세요</option>
        <option th:each="item : ${items}"
                th:value="${item.id}"
                th:text="'[' + ${item.barcode} + '] ' + ${item.name}">
        </option>
      </select>
      <p th:if="${#fields.hasErrors('itemId')}" th:errors="*{itemId}"></p>
    </div>

    <!-- 로케이션 선택 -->
    <div>
      <label class="form-label small fw-bold text-secondary">로케이션</label>
      <select th:field="*{locationId}" id="location-select" class="form-control">
        <option value="">창고와 상품 선택시 목록이 나타납니다.</option>
<!--        <option th:each="loc : ${locations}"-->
<!--                th:value="${loc.id}"-->
<!--                th:text="${loc.locCode} + ' (' + ${loc.warehouseName} + ')'">-->
<!--        </option>-->
      </select>
      <p th:if="${#fields.hasErrors('locationId')}" th:errors="*{locationId}"></p>
    </div>
    <!-- 수량 입력 -->
    <div>
      <label class="form-label small fw-bold text-secondary">수량</label>
      <input type="number" th:field="*{quantity}" class="form-control" min="1" required>
      <p th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></p>
    </div>

    <div>
      <label class="form-label small fw-bold text-secondary">재고 상태</label>
      <select th:field="*{status}" class="form-control" required>
        <option value="">상태 선택</option>
        <option th:each="status : ${stockStatus}"
                th:value="${status}"
                th:text="${status.description}"></option>
      </select>
    </div>

    <div class="d-flex gap-2 mt-3">
      <button type="submit" class="btn btn-success px-5">등록</button>
      <a th:href="@{/stocks/list}" class="btn btn-secondary px-5">취소</a>
    </div>
  </form>
</div>
<script>
  document.addEventListener('DOMContentLoaded',function(){
    const warehouseSelect = document.getElementById("warehouse-select");
    const itemSelect = document.getElementById("item-select");
    const locationSelect = document.getElementById("location-select");

    function loadLocations() {
      const warehouseId = warehouseSelect.value;
      const itemId = itemSelect.value;

      // 둘 중 하나라도 선택이 안 되어 있다면 로케이션 목록을 초기화하고 중단
      if (!warehouseId || !itemId) {
        locationSelect.innerHTML = '<option value="">--- 창고와 상품을 모두 선택하세요 ---</option>';
        return;
      }

      locationSelect.innerHTML = '<option value="">--- 로케이션을 불러오는중... ---</option>';

      fetch(`/stocks/api/locations-itemAndWarehouse?itemId=${itemId}&warehouseId=${warehouseId}`)
              .then(response => {
                if (!response.ok) throw new Error('네트워크 응답에 문제가 발생했습니다.')
                return response.json();
              })
              .then(data => {
                locationSelect.innerHTML = '<option value="">--- 로케이션 선택 ---</option>';

                if (data.length === 0) {
                  locationSelect.innerHTML = '<option value="">--- 해당 창고에 입고 가능한 로케이션이 없습니다. ---</option>';
                  return;
                }

                data.forEach(loc => {
                  const option = document.createElement('option');
                  option.value = loc.id;
                  option.text = `[${loc.warehouseName}] ${loc.locCode}`;
                  locationSelect.appendChild(option);
                });
              })
              .catch(error => {
                console.error('Error:', error);
                locationSelect.innerHTML = '<option value="">--- 로케이션을 불러오지 못했습니다. ---</option>';
              });
    }
    warehouseSelect.addEventListener('change', loadLocations);
    itemSelect.addEventListener('change', loadLocations);
  })
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>재고 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">

    <div class="py-5 text-center">
        <h2>📦 재고 현황 목록</h2>
    </div>

    <!-- 검색 필터 (선택 사항) -->
    <div class="filter-section" style="margin-bottom: 20px;">
        <form th:action="@{/stocks/list}" method="get" class="form-inline">
            <input type="text" name="itemName" placeholder="상품/창고/로케이션 검색" class="form-control mb-3">
            <button type="submit" class="btn btn-secondary">검색</button>
        </form>
    </div>

    <div class="row">
        <div class="col">
            <button class="btn btn-success float-end"
                    th:onclick="|location.href='@{/warehouses/new}'|" type="button">신규 재고 등록</button>
        </div>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>No.</th>
            <th>창고명</th>
            <th>로케이션 코드</th>
            <th>상품명</th>
            <th>현재 수량</th>
            <th>상태</th>
            <th>최종 수정일</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <!-- 데이터가 없는 경우 -->
        <tr th:if="${#lists.isEmpty(stocks)}">
            <td colspan="7" style="text-align: center;">조회된 재고가 없습니다.</td>
        </tr>

        <!-- 데이터가 있는 경우 반복문 -->
        <tr th:each="stock, stat : ${stocks}">
            <td th:text="${stat.count}">1</td>
            <td><span class="badge bg-info text-dark" th:text="${stock.warehouseName}">A창고</span></td>
            <td th:text="${stock.locationLocCode}">LOC-A-01</td>
            <td>
                <span th:text="${stock.itemName}">상품명</span>
            </td>
            <td th:text="${#numbers.formatInteger(stock.quantity, 0, 'COMMA')}">1,000</td>
            <td>
                <!-- 상태별 배지 색상 처리 -->
                <span class="badge"
                      th:classappend="${stock.status.name() == 'AVAILABLE' ? 'bg-success' :
                                          (stock.status.name() == 'HOLD' ? 'bg-warning' : 'bg-danger')}"
                      th:text="${stock.status}">
                        AVAILABLE
                    </span>
            </td>
            <td th:text="${#temporals.format(stock.lastModifiedDate, 'yyyy-MM-dd HH:mm')}">2026-05-10 14:00</td>
            <td>
                <a th:href="@{/stocks/move/{id}(id=${stock.id})}" class="btn btn-sm btn-info">이동</a>
                <a th:href="@{/stocks/edit/{id}(id=${stock.id})}" class="btn btn-sm btn-outline-secondary">수정</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

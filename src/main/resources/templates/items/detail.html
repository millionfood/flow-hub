<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>상품 조회</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">

    <div class="py-5 text-center">
        <h2>상품 조회</h2>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="row mb-3">
                <label class="col-sm-3 fw-bold">상품 ID</label>
                <div class="col-sm-9" th:text="${itemDetail.id}">1</div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-3 fw-bold">바코드</label>
                <div class="col-sm-9"><code th:text="${itemDetail.barcode}">8801234567890</code></div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-3 fw-bold">상품명</label>
                <div class="col-sm-9" th:text="${itemDetail.name}">상품명</div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-3 fw-bold">상세설명</label>
                <div class="col-sm-9" th:text="${itemDetail.description}">상세설명</div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-3 fw-bold">단위</label>
                <div class="col-sm-9" th:text="${itemDetail.unit.name()}">단위</div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-3 fw-bold">가격</label>
                <div class="col-sm-9" th:text="${#numbers.formatInteger(itemDetail.price, 3, 'COMMA')} + '원'">1,000원</div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-3 fw-bold">등록일</label>
                <div class="col-sm-9" th:text="${#temporals.format(itemDetail.createdDate, 'yyyy-MM-dd HH:mm:ss')}">2026-05-08</div>
            </div>
        </div>
    </div>

    <hr class="my-4">

    <div class="row">
        <div class="col" >
            <button class="w-100 btn btn-primary btn-lg"
                    th:onclick="|location.href='@{/admin/item/edit/{id}(id=${itemDetail.id})}'|" type="button">수정하기</button>
        </div>
        <div class="col" >
            <form th:action="@{/items/delete/{id}(id=${itemDetail.id})}" method="post"
                  onsubmit="return confirm('이 상품을 삭제하시겠습니까?\n삭제된 데이터는 복구할 수 없습니다.');">
                <button class="w-100 btn btn-danger btn-lg" type="submit">삭제하기</button>
            </form>
        </div>
        <div class="col">
            <a class="w-100 btn btn-secondary btn-lg"
                    th:href="@{/admin/items}">목록으로</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>재고 입고 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h2>재고 입고</h2>

    <form th:action="@{/items/new}" th:object="${itemForm}" method="post">
        <div class="mb-3">
            <label th:for="name">상품명</label>
            <input type="text" th:field="*{name}" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label th:for="description">설명</label>
            <input type="text" th:field="*{description}" class="form-control">
        </div>

        <div class="mb-3">
            <label th:for="price">가격</label>
            <input type="number" th:field="*{price}" class="form-control">
        </div>

        <div class="mb-3">
            <label th:for="unit">단위</label>
            <select th:field="*{unit}" class="form-select">
                <option value="">단위 선택</option>
                <option th:each="unit : ${itemUnits}"
                        th:value="${unit}"
                        th:text="${unit.description}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">등록</button>
    </form>
</div>
</body>
</html>

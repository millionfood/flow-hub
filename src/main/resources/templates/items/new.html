<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">

    <div class="py-5 text-center">
        <h2>상품 등록</h2>
    </div>

    <form th:action="@{/admin/item/new}" th:object="${itemForm}" method="post">
        <div class="mb-3">
            <label th:for="name">상품명</label>
            <input type="text" th:field="*{name}" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label th:for="description">설명</label>
            <input type="text" th:field="*{description}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label th:for="price">가격</label>
            <input type="number" th:field="*{price}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label th:for="unit">단위</label>
            <select th:field="*{unit}" class="form-select" required>
                <option value="">단위 선택</option>
                <option th:each="unit : ${itemUnits}"
                        th:value="${unit}"
                        th:text="${unit.description}"></option>
            </select>
        </div>

        <hr class="my-4">
        <div class="row">
            <div class="col">
                <button class="w-100 btn btn-primary btn-lg" type="submit">등록 완료</button>
            </div>
            <div class="col">
                <a th:href="@{/items/list}" class="w-100 btn btn-secondary btn-lg">취소</a>
            </div>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

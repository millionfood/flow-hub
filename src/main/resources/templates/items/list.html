<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-5">

    <!-- 🎛️ 상단 물류 통합 대시보드 탭 -->
    <div class="card p-2 mb-4 shadow-sm bg-white">
        <ul class="nav nav-pills nav-fill">
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/warehouses/list}">🏢 사용가능 창고 조회</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/location/list}">📍 로케이션(랙) 현황</a></li>
            <li class="nav-item"><a class="nav-link active bg-dark" th:href="@{/items/list}">📦 등록가능 상품 조회</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/stocks/list}">📜 재고 조회 및 등록</a></li>
        </ul>
    </div>

    <div class="py-5 text-center">
        <h2>🏷️ 상품 목록</h2>
    </div>

    <!-- 검색 필터 (선택 사항) -->
    <div class="card shadow-sm bg-white p-3 mb-4">
        <form th:action="@{/items/list}" method="get" id="search-form" class="row g-3 align-items-center">

            <!-- 명칭 및 바코드 통합 검색 -->
            <div class="col-md-11">
                <label class="form-label small fw-bold text-secondary">대표 상품명 / SKU 바코드 식별자</label>
                <input type="text" th:field="${cond.itemKeyword}" name="itemKeyword" class="form-control form-control-sm" placeholder="상품명 또는 13자리 바코드 번호를 입력하세요">
            </div>

            <!-- 검색 버튼 -->
            <div class="col-md-1 align-self-end">
                <button type="submit" class="btn btn-dark btn-sm w-100 fw-bold">검색</button>
            </div>
        </form>
    </div>

    <div class="d-flex justify-content-end gap-2 mb-3">
        <a class="btn btn-secondary"
                href="/user/home" type="button">이전</a>
    </div>

    <table class="table table-hover border">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>바코드</th>
            <th>상품명</th>
            <th>가격</th>
            <th>단위</th>
            <th>설명</th>
            <th>등록일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${page}">
            <td th:text="${item.id}">1</td>
            <td  ><span th:text="${item.barcode}" class="badge bg-secondary">8801234567890</span></td>
<!--            <td><a th:href="@{/items/detail/{itemId}(itemId=${item.id})}" th:text="${item.barcode}">8801234567890</a></td>-->
            <td th:text="${item.name}">상품명</td>
            <td th:text="${#numbers.formatInteger(item.price, 3, 'COMMA')} + '원'">1,000원</td>
            <td th:text="${item.unit}">개</td>
            <!-- Enum의 description 출력 -->
            <td th:text="${item.description}" class="text-success">설명</td>
            <!-- BaseEntity의 날짜 포맷팅 -->
            <td th:text="${#temporals.format(item.createdDate, 'yyyy-MM-dd HH:mm')}">2026-05-08</td>
        </tr>
        </tbody>
    </table>
    <div th:replace="~{fragments/navbar :: pagingBar(${page})}"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

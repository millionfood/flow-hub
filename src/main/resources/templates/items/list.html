<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>재고 입고 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 1000px;">
    <div class="py-5 text-center">
        <h2>상품 목록</h2>
    </div>

    <div class="row">
        <div class="col">
            <button class="btn btn-primary float-end mb-3"
                    th:onclick="|location.href='@{/items/new}'|" type="button">상품 등록</button>
        </div>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>바코드</th>
            <th>상품명</th>
            <th>가격</th>
            <th>단위</th>
            <th>설명</th>
            <th>등록일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td><a th:href="@{/items/detail/{itemId}(itemId=${item.id})}" th:text="${item.id}">1</a></td>
            <td th:text="${item.barcode}">8801234567890</td>
            <td th:text="${item.name}">상품명</td>
            <td th:text="${#numbers.formatInteger(item.price, 3, 'COMMA')} + '원'">1,000원</td>
            <td th:text="${item.unit}">개</td>
            <!-- Enum의 description 출력 -->
            <td><span class="badge bg-info text-dark" th:text="${item.description}">설명</span></td>
            <!-- BaseEntity의 날짜 포맷팅 -->
            <td th:text="${#temporals.format(item.createdDate, 'yyyy-MM-dd HH:mm')}">2026-05-08</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

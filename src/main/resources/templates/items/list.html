<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">

    <div class="py-5 text-center">
        <h2>🏷️ 상품 목록</h2>
    </div>

    <!-- 검색 필터 (선택 사항) -->
    <div class="filter-section" style="margin-bottom: 20px;">
        <form th:action="@{/items/list}" method="get" class="form-inline">
            <input type="text" name="itemName" placeholder="상품 검색" class="form-control mb-3">
            <button type="submit" class="btn btn-secondary">검색</button>
        </form>
    </div>

    <div class="row">
        <div class="col">
            <button class="btn btn-primary float-end mb-3"
                    th:onclick="|location.href='@{/items/new}'|" type="button">상품 등록</button>
        </div>
    </div>

    <table class="table table-hover border">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>바코드</th>
            <th>상품명</th>
            <th>가격</th>
            <th>단위</th>
            <th>설명</th>
            <th>등록일</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.id}">1</td>
            <td  ><span th:text="${item.barcode}" class="badge bg-secondary">8801234567890</span></td>
<!--            <td><a th:href="@{/items/detail/{itemId}(itemId=${item.id})}" th:text="${item.barcode}">8801234567890</a></td>-->
            <td th:text="${item.name}">상품명</td>
            <td th:text="${#numbers.formatInteger(item.price, 3, 'COMMA')} + '원'">1,000원</td>
            <td th:text="${item.unit}">개</td>
            <!-- Enum의 description 출력 -->
            <td th:text="${item.description}" class="text-success">설명</td>
            <!-- BaseEntity의 날짜 포맷팅 -->
            <td th:text="${#temporals.format(item.createdDate, 'yyyy-MM-dd HH:mm')}">2026-05-08</td>
            <td>
                <a th:href="@{/items/detail/{itemId}(itemId=${item.id})}" class="btn btn-sm btn-outline-secondary">상세정보</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

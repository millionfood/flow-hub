<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Flow-Hub | 상품 재고 실사</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-5">

    <!-- 🎛️ 상단 물류 통합 대시보드 탭 -->
    <div class="card p-2 mb-4 shadow-sm bg-white">
        <ul class="nav nav-pills nav-fill">
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/admin/users}">👑 시스템 회원 관리</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/admin/warehouses}">🏢 창고 정보 인벤토리</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/admin/locations}">📍 세부 로케이션(랙) 현황</a></li>
            <li class="nav-item"><a class="nav-link active bg-dark" th:href="@{/admin/items}">📦 상품 아이템 및 재고</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/admin/histories/user}">📜 시스템 변경 이력</a></li>
        </ul>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>📦 통합 상품 마스터 엔티티 및 현재고</h4>
        <a class="btn btn-warning btn-sm" th:href="@{/admin/item/new}">+ 새 아이템 등록</a>
    </div>

    <!-- 🔍 1. 상품 전용 동적 검색 필터 바 (ItemSearchCond 연동) -->
    <div class="card shadow-sm bg-white p-3 mb-4">
        <form th:action="@{/admin/items}" method="get" id="search-form" class="row g-3 align-items-center">

            <!-- 명칭 및 바코드 통합 검색 -->
            <div class="col-md-11">
                <label class="form-label small fw-bold text-secondary">대표 상품명 / SKU 바코드 식별자</label>
                <input type="text" th:field="${cond.itemKeyword}" name="itemKeyword" class="form-control form-control-sm" placeholder="상품명 또는 13자리 바코드 번호를 입력하세요">
            </div>

            <!-- 검색 버튼 -->
            <div class="col-md-1 align-self-end">
                <button type="submit" class="btn btn-dark btn-sm w-100 fw-bold">검색</button>
            </div>
        </form>
    </div>

    <div class="card shadow-sm bg-white p-3">
        <table class="table table-hover text-center align-middle small">
            <thead class="table-secondary text-secondary fw-bold">
            <tr>
                <th>상품 ID</th>
                <th>SKU 식별 바코드</th>
                <th class="text-center" style="width: 50%;">대표 상품명</th>
                <th class="text-center pe-4">보유 수량 (EA)</th>
                <th class="text-center">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="i : ${page.getContent()}">
                <td th:text="${i.id}">5001</td>
                <td class="text-secondary font-monospace" th:text="${i.barcode}">8801043012921</td>
                <td class="text-center fw-bold" th:text="${i.name}" style="width: 50%;">고급 저온압착 올리브유 500ml</td>
                <td class="fw-bold text-center pe-4"
                    th:text="|${#numbers.formatInteger(i.totalQuantity, 1, 'COMMA')} EA|"
                    th:classappend="${i.totalQuantity < 10 ? 'text-danger' : 'text-dark'}">1,250 EA</td>
                <td>
                    <a th:href="@{/admin/item/detail/{id}(id=${i.id})}" class="btn btn-sm btn-outline-secondary">상세정보</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(page.getContent())}">
                <td colspan="6" class="text-muted py-4">현재 물류 시스템에 등록된 상품 원장이 없습니다.</td>
            </tr>
            </tbody>
        </table>
        <div th:replace="~{fragments/navbar :: pagingBar(${page})}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

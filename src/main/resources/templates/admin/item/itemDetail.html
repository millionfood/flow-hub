<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Flow-Hub | 상품 재고 세부 실사</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        body { background-color: #f8f9fa; font-family: 'Malgun Gothic', sans-serif; }
        .table th { white-space: nowrap; }
    </style>
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-5">

    <div class="card p-2 mb-4 shadow-sm bg-white">
        <ul class="nav nav-pills nav-fill">
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/admin/users}">👑 시스템 회원 관리</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/admin/warehouses}">🏢 창고 정보 인벤토리</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/admin/locations}">📍 세부 로케이션(랙) 현황</a></li>
            <li class="nav-item"><a class="nav-link active bg-dark" th:href="@{/admin/items}">📦 상품 아이템 및 재고</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/admin/histories/user}">📜 시스템 변경 이력</a></li>
        </ul>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>📋 선택 상품별 분산 적재 세부 실사 현황</h4>
        <a th:href="@{/admin/items}" class="btn btn-sm btn-outline-dark fw-bold">목록으로</a>
    </div>

    <div class="card shadow-sm bg-white p-3 mb-4">
        <form th:action="@{/admin/item/detail/{id}(id=${item.id})}" method="get" id="search-form" class="row g-3">
            <div class="col-md-3">
                <label class="form-label small fw-bold text-secondary">보관 창고</label>
                <select th:field="${cond.warehouseId}" name="warehouseId" class="form-select form-select-sm">
                    <option value=""> 전체 창고 </option>
                    <option th:each="w : ${warehouses}" th:value="${w.id}" th:text="${w.name}">제1물류센터</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label small fw-bold text-secondary">관리 구역 (Zone)</label>
                <select th:field="${cond.locationZone}" name="locationZone" class="form-select form-select-sm">
                    <option value=""> 전체 구역 </option>
                    <option th:each="z : ${zones}"
                            th:value="${z.name()}" th:text="${z.description}">냉장구역</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label small fw-bold text-secondary">로케이션 코드</label>
                <input type="text" th:field="${cond.locCode}" name="locCode" class="form-control form-control-sm" placeholder="예: A-3-2">
            </div>

            <div class="col-md-2">
                <label class="form-label small fw-bold text-secondary">재고 상태 (Status)</label>
                <select th:field="${cond.stockStatus}" name="stockStatus" class="form-select form-select-sm">
                    <option value=""> 전체 상태 </option>
                    <option th:each="s : ${status}"
                            th:value="${s.name()}" th:text="${s.description}">정상 (NORMAL)</option>
                </select>
            </div>

            <div class="col-md-1 align-self-end">
                <button type="submit" class="btn btn-dark btn-sm w-100 fw-bold">검색</button>
            </div>
        </form>
    </div>

    <div class="card shadow-sm bg-white p-3">
        <table class="table table-hover text-center align-middle small">
            <thead class="table-secondary text-secondary fw-bold">
            <tr>
                <th>보관 창고</th>
                <th>관리 구역 (Zone)</th>
                <th>세부 로케이션</th>
                <th>SKU 식별 바코드</th>
                <th class="text-center" style="width: 35%;">대표 상품명</th>
                <th>재고 상태 (Status)</th>
                <th class="text-center pe-4">적재 수량 (EA)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="stock : ${page.getContent()}">
                <td class="fw-bold text-dark" th:text="${stock.warehouseName}">제1물류센터(시흥)</td>

                <td>
                    <span class="badge fw-semibold px-2.5 py-1.5"
                          th:text="${stock.locationZone.description}"
                          th:classappend="${stock.locationZone.name() == 'COLD' ? 'bg-primary bg-opacity-10 text-primary' :
                                           (stock.locationZone.name() == 'FRIDGE' ? 'bg-info bg-opacity-10 text-info' :
                                            (stock.locationZone.name() == 'ROOM' ? 'bg-success bg-opacity-10 text-success' : 'bg-danger bg-opacity-10 text-danger'))}">
                        상온구역
                    </span>
                </td>

                <td class="font-monospace fw-bold text-secondary" th:text="${stock.locCode}">A-3-2</td>

                <td class="text-secondary font-monospace" th:text="${stock.barcode}">8801043012921</td>

                <td class="text-center fw-bold" th:text="${stock.itemName}" style="width: 35%;">고급 저온압착 올리브유 500ml</td>

                <td>
                    <span class="badge px-3 py-1.5"
                          th:text="${stock.stockStatus.description}"
                          th:classappend="${stock.stockStatus?.name() == 'NORMAL' ? 'bg-success bg-opacity-10 text-success' :
                                           (stock.stockStatus?.name() == 'DAMAGED' ? 'bg-danger bg-opacity-10 text-danger' : 'bg-warning bg-opacity-10 text-warning')}">
                        정상 (NORMAL)
                    </span>
                </td>

                <td class="fw-bold text-center pe-4"
                    th:text="|${#numbers.formatInteger(stock.quantity, 1, 'COMMA')} EA|"
                    th:classappend="${stock.quantity < 10 ? 'text-danger' : 'text-dark'}">250 EA</td>
            </tr>

            <tr th:if="${#lists.isEmpty(page.getContent())}">
                <td colspan="7" class="text-muted py-4">해당 상품에 대한 로케이션별 실재고 적재 내역이 존재하지 않습니다.</td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{fragments/navbar :: pagingBar(${page})}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

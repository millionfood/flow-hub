<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Flow-Hub | 창고 정보 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-5">

    <!-- 🎛️ 상단 물류 통합 대시보드 탭 -->
    <div class="card p-2 mb-4 shadow-sm bg-white">
        <ul class="nav nav-pills nav-fill">
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/admin/users}">👑 시스템 회원 관리</a></li>
            <li class="nav-item"><a class="nav-link active bg-dark" th:href="@{/admin/warehouses}">🏢 창고 정보 인벤토리</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/admin/locations}">📍 세부 로케이션(랙) 현황</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/admin/items}">📦 상품 아이템 및 재고</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/admin/histories/user}">📜 시스템 변경 이력</a></li>
        </ul>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>🏢 등록 창고 마스터 인벤토리</h4>
        <a class="btn btn-primary btn-sm" th:href="@{/admin/warehouse/new}">+ 새 창고 등록</a>
    </div>

    <!-- 🔍 물류 창고 전용 동적 검색 필터 바 -->
    <div class="card shadow-sm bg-white p-3 mb-4">
        <form th:action="@{/admin/warehouses}" method="get" id="search-form" class="row g-3 align-items-center">
            <!-- 3. 창고 식별 정보 검색 -->
            <div class="col-md-5">
                <label class="form-label small fw-bold text-secondary">창고명</label>
                <input type="text" th:field="${cond.warehouseSearch}" name="warehouseSearch" class="form-control form-control-sm" placeholder="창고 이름 입력">
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold text-secondary">관리자 이름</label>
                <input type="text" th:field="${cond.adminName}" name="adminName" class="form-control form-control-sm" placeholder="관리자 이름 입력">
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold text-secondary">관리자 연락처</label>
                <input type="text" th:field="${cond.adminTel}" name="adminTel" class="form-control form-control-sm" placeholder="관리자 연락처 입력">
            </div>

            <div class="col-md-1 align-self-end">
                <button type="submit" class="btn btn-dark btn-sm w-100 fw-bold">필터</button>
            </div>
        </form>
    </div>

    <div class="card shadow-sm bg-white p-3">
        <table class="table table-hover text-center align-middle small">
            <thead class="table-secondary text-secondary fw-bold">
            <tr>
                <th>시스템 ID</th>
                <th>창고명</th>
                <th>주소</th>
                <th>관리자 이름</th>
                <th>관리자 연락처</th>
                <th>사용 여부</th>
                <th>관리</th>
            </tr>
            </tr>
            </thead>
            <tbody>
            <tr th:each="w : ${page.getContent()}">
                <td th:text="${w.id}">1</td>
                <td th:text="${w.name}">서울 제1중앙물류창고</td>
                <td class="fw-bold text-primary" th:text="${w.address}">SEOUL</td>
                <td class="fw-bold text-dark" th:text="${w.registerName}">안진혁</td>
                <td class="fw-bold text-secondary" th:text="${w.registerTel}">01038041915</td>
                <td>
                    <span th:if="${w.useYn.name() == 'Y'}" class="text-success">사용중</span>
                    <span th:if="${w.useYn.name() == 'N'}" class="text-danger">미사용</span>
                </td>
                <td>
                    <a th:href="@{/admin/warehouse/detail/{id}(id=${w.id})}" class="btn btn-sm btn-outline-secondary">상세정보</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(page.content)}">
                <td colspan="6" class="text-muted py-4">등록된 물류 창고 인프라가 없습니다.</td>
            </tr>
            </tbody>
        </table>
        <div th:replace="~{fragments/navbar :: pagingBar(${page})}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

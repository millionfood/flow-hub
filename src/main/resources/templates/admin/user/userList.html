<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Flow-Hub | 관리자 마스터</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-5">

    <!-- 🎛️ 상단 물류 통합 대시보드 탭 -->
    <div class="card p-2 mb-4 shadow-sm bg-white">
        <ul class="nav nav-pills nav-fill">
            <li class="nav-item"><a class="nav-link active bg-dark" th:href="@{/admin/users}">👑 시스템 회원 관리</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/admin/warehouses}">🏢 창고 정보 인벤토리</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/admin/locations}">📍 세부 로케이션(랙) 현황</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/admin/items}">📦 상품 아이템 및 재고</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/admin/histories/user}">📜 시스템 변경 이력</a></li>
        </ul>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
        <h2>👑 시스템 회원 관리 (관리자 전용)</h2>
        <a th:href="@{/static}" class="btn btn-secondary btn-sm">메인으로</a>
    </div>

    <!-- 🔍 회원 관리 전용 동적 검색 필터 바 -->
    <div class="card shadow-sm bg-white p-3 mb-4">
        <form th:action="@{/admin/users}" method="get" class="row g-3 align-items-center">

            <!-- 1. 계정 상태 필터 -->
            <div class="col-md-3">
                <label class="form-label small fw-bold text-secondary">계정 상태</label>
                <select th:field="${cond.useYn}" name="status" class="form-select form-select-sm">
                    <option value="">전체 상태</option>
                    <option value="Y">활성화 (ACTIVE)</option>
                    <option value="N">계정 정지 (BLOCK)</option>
                </select>
            </div>

            <!-- 3. 통합 키워드 검색란 (이름, 이메일, 연락처 등) -->
            <div class="col-md-8">
                <label class="form-label small fw-bold text-secondary">통합 회원 검색</label>
                <input type="text" th:field="${cond.keyword}" name="keyword" class="form-control form-control-sm" placeholder="검색할 회원의 이름 또는 이메일을 입력하세요">
            </div>

            <!-- 검색 버튼 -->
            <div class="col-md-1 align-self-end">
                <button type="submit" class="btn btn-dark btn-sm w-100 fw-bold">조회</button>
            </div>
        </form>
    </div>

    <div class="card shadow bg-white p-3">
        <table class="table table-hover align-middle text-center">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>이메일</th>
                <th>이름</th>
                <th>계정권한</th>
                <th>계정 상태</th>
                <th>관리 액션</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}">1</td>
                <td th:text="${u.email}" class="text-start">user@test.com</td>
                <td th:text="${u.name}">홍길동</td>
                <td>
                        <span th:text="${u.role}"
                              th:classappend="${u.role.name() == 'ADMIN' ? 'badge bg-danger' : 'badge bg-primary'}">
                            USER
                        </span>
                </td>
                <td>
                        <span th:id="|status-badge-${u.id}|"
                              th:text="${u.useYn.name()}"
                              th:classappend="${u.useYn.name() == 'Y' ? 'badge bg-success' : 'badge bg-secondary'}">
                              Y
                        </span>
                </td>
                <td>
                    <div class="btn-group btn-group-sm">
                        <!-- 🚨 상태에 따라 id, class, text, 인자값이 동적으로 변하는 비동기 버튼 -->
                        <button type="button"
                                th:id="|status-btn-${u.id}|"
                                class="status-toggle-btn"
                                th:classappend="${u.useYn.name() == 'Y' ? 'btn btn-outline-danger' : 'btn btn-outline-success'}"
                                th:text="${u.useYn.name() == 'Y' ? '정지' : '활성화'}"
                                th:data-id="${u.id}"
                                th:data-status="${u.useYn.name()}">
                            정지
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<!-- 🚨 사유 입력용 부트스트랩 공통 모달창 -->
<div class="modal fade" id="reasonModal" tabindex="-1" aria-labelledby="reasonModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="reasonModalLabel">⚠️ 계정 상태 변경</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- 어떤 작업을 하는지 동적으로 보여줄 텍스트 -->
                <p id="modalTargetText" class="fw-bold"></p>
                <div class="mb-3">
                    <label for="statusReason" class="form-label">변경 사유를 입력해 주세요 (필수)</label>
                    <textarea class="form-control" id="statusReason" rows="3" placeholder="사유를 입력하세요..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <!-- 🚨 이 버튼을 누르면 실제 fetch 요청이 날아갑니다 -->
                <button type="button" class="btn btn-primary" id="confirmStatusBtn">확인</button>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 문서가 로드되면 모든 상태 변경 버튼에 클릭 이벤트를 일괄 부착합니다.
    document.addEventListener("DOMContentLoaded", function() {
        const toggleButtons = document.querySelectorAll(".status-toggle-btn");

        // 부트스트랩 모달 제어를 위한 객체 및 상태 저장용 변수
        const reasonModal = new bootstrap.Modal(document.getElementById('reasonModal'));
        let activeTarget = {
            userId: null,
            currentStatus: null,
            endpoint: null,
            isActionDisable: null,
            btn: null
        };

        toggleButtons.forEach(button => {
            button.addEventListener("click", function() {
                // 버튼의 data- 속성에서 id와 status를 꺼내옵니다.
                const userId = this.getAttribute("data-id");
                const currentStatus = this.getAttribute("data-status");

                const isActionDisable = (currentStatus === 'Y');
                const endpoint = isActionDisable ? 'disable' : 'enable';

                // 모달창에 띄울 가이드 문구를 세팅하고 모달을 연다.
                const actionText = isActionDisable ? '정지' : '활성화';
                document.getElementById('modalTargetText').innerText = `선택한 계정을 정말로 [${actionText}] 하시겠습니까?`;
                document.getElementById('statusReason').value = ''; // 이전 입력값 청소

                // 모달 확인 버튼이 클릭되었을 때 쓸 수 있도록 현재 버튼 정보를 컨텍스트에 저장
                activeTarget = {
                    userId: userId,
                    currentStatus: currentStatus,
                    endpoint: endpoint,
                    isActionDisable: isActionDisable,
                    btn: this
                };

                reasonModal.show();
            });
        });

        // 모달 안의 '확인' 버튼을 눌렀을 때 기존 fetch 로직이 실행된다.
        document.getElementById('confirmStatusBtn').addEventListener('click', function(event) {
            const reasonInputValue = document.getElementById('statusReason').value.trim();

            if (!reasonInputValue) {
                alert("사유를 입력하셔야 처리가 가능합니다!");
                return;
            }

            const { userId, endpoint, isActionDisable, btn } = activeTarget;
            const badge = document.getElementById(`status-badge-${userId}`);

            // 컨트롤러의 @RequestParam("reason") 구조에 맞게 URL 뒤에 쿼리 파라미터를 붙여줍니다.
            const params = new URLSearchParams();
            params.append("reason", reasonInputValue);

            fetch(`/admin/user/${endpoint}/${userId}?${params.toString()}`, {
                method: 'POST'
            })
                .then(response => {
                    if (response.ok) {
                        if (isActionDisable) {
                            // 정지 성공 시 -> '활성화' 버튼(초록색)으로 변신
                            btn.className = 'status-toggle-btn btn btn-outline-success btn-sm';
                            btn.innerText = '활성화';
                            btn.setAttribute('data-status', 'N'); // 다음 클릭을 위해 상태 갱신
                            if (badge) {
                                badge.className = 'badge bg-secondary';
                                badge.innerText = 'N';
                            }
                        } else {
                            // 활성화 성공 시 -> '정지' 버튼(빨간색)으로 변신
                            btn.className = 'status-toggle-btn btn btn-outline-danger btn-sm';
                            btn.innerText = '정지';
                            btn.setAttribute('data-status', 'Y'); // 다음 클릭을 위해 상태 갱신
                            if (badge) {
                                badge.className = 'badge bg-success';
                                badge.innerText = 'Y';
                            }
                        }
                        // 성공 후 모달창을 닫아준다.
                        reasonModal.hide();
                        alert('상태가 실시간으로 반영되었습니다.');
                    } else {
                        alert('요청 처리에 실패했습니다.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('서버 통신 중 오류가 발생했습니다.');
                });
        })
    });
</script>
</body>
</html>

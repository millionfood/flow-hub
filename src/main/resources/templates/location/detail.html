<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로케이션 상세 정보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container" th:object="${location}">
    <div class="py-5 text-center">
        <h2>로케이션 상세 정보</h2>
    </div>

    <div class="card-body">
        <div class="row">
            <!-- 왼쪽 섹션: 핵심 코드 정보 -->
            <div class="col-md-6 border-end">
                <h5 class="text-muted small">로케이션 코드</h5>
                <p class="display-6 fw-bold text-primary" th:text="*{locCode}">A-01-01-01</p>

                <h5 class="text-muted small mt-4">소속 창고</h5>
                <p class="fs-5" th:text="*{warehouseName}">부산 제1창고</p>
            </div>

            <!-- 오른쪽 섹션: 세부 위치 정보 -->
            <div class="col-md-6 ps-4">
                <div class="row mb-3">
                    <div class="col-6">
                        <h5 class="text-muted small">구역(Zone)</h5>
                        <p class="fs-5" th:text="*{zone}">ZONE_A</p>
                    </div>
                    <div class="col-6">
                        <h5 class="text-muted small">행(Row)</h5>
                        <p class="fs-5" th:text="*{row}">01</p>
                    </div>
                </div>
                <div class="row">
                    <div class="col-6">
                        <h5 class="text-muted small">열(Col)</h5>
                        <p class="fs-5" th:text="*{col}">01</p>
                    </div>
                    <div class="col-6">
                        <h5 class="text-muted small">단(Level)</h5>
                        <p class="fs-5" th:text="*{level}">01</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card-footer bg-white">
        <!-- justify-content-end: 내용을 오른쪽으로 밀어냄 / g-2: 버튼 간격 -->
        <div class="d-flex justify-content-end g-2">

            <!-- 1. 목록으로 (마진을 주어 버튼 사이 간격 조절) -->
            <div class="me-2">
                <a th:href="@{/location/list}" class="btn btn-secondary btn-lg">목록으로</a>
            </div>

            <!-- 3. 사용 중지 (조건부 노출) -->
            <div th:if="*{useYn.name() == 'Y'}">
                <form th:action="@{/location/stopUse/{id}(id=*{id})}" method="post">
                    <button class="btn btn-danger btn-lg" type="submit"
                            onclick="return confirm('이 로케이션을 사용 중지하시겠습니까?')">사용 중지</button>
                </form>
            </div>

            <!-- 4. 다시 사용 (조건부 노출) -->
            <div th:if="*{useYn.name() == 'N'}">
                <form th:action="@{/location/reUse/{id}(id=*{id})}" method="post">
                    <button class="btn btn-success btn-lg" type="submit"
                            onclick="return confirm('이 로케이션을 다시 사용하시겠습니까?')">다시 사용</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로케이션 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h2>로케이션 등록</h2>

    <form th:action th:object="${locationForm}" method="post">
        <!-- 1. 창고 선택 (드롭다운) -->
        <div class="mb-3">
            <label th:for="warehouseId">창고 선택</label>
            <select th:field="*{warehouseId}" class="form-select"
                    th:class="${#fields.hasErrors('warehouseId')} ? 'form-select field-error' : 'form-select'">
                <option value="">== 창고를 선택하세요 ==</option>
                <option th:each="w : ${warehouseList}"
                        th:value="${w.id}"
                        th:text="${w.name}">제1창고</option>
            </select>
            <div class="text-danger" th:errors="*{warehouseId}">에러 메시지</div>
        </div>

        <!-- 2. 구역 선택 (LocationZone Enum) -->
        <div class="mb-3">
            <label th:for="zone">구역 (Zone)</label>
            <select th:field="*{zone}" class="form-select">
                <option value="">== 구역 선택 ==</option>
                <option th:each="zone : ${locationZone}"
                        th:value="${zone}"
                        th:text="${zone.description}">상온</option>
            </select>
        </div>

        <!-- 3. 상세 위치 (행/열/단) -->
        <div class="row">
            <div class="col-md-4 mb-3">
                <label th:for="row">행 (Row)</label>
                <input type="text" th:field="*{row}" class="form-control" placeholder="예: 01" maxlength="2">
            </div>
            <div class="col-md-4 mb-3">
                <label th:for="col">열 (Col)</label>
                <input type="text" th:field="*{col}" class="form-control" placeholder="예: 01" maxlength="2">
            </div>
            <div class="col-md-4 mb-3">
                <label th:for="level">단 (Level)</label>
                <input type="text" th:field="*{level}" class="form-control" placeholder="예: 01" maxlength="2">
            </div>
        </div>

        <hr class="my-4">
        <div class="row">
            <div class="col">
                <button class="w-100 btn btn-primary btn-lg" type="submit">등록 완료</button>
            </div>
            <div class="col">
                <button class="w-100 btn btn-secondary btn-lg"
                        th:onclick="|location.href='@{/locations}'|" type="button">취소</button>
            </div>
        </div>
    </form>
</div>
</body>
</html>

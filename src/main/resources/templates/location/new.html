<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로케이션 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 이미 등록된 로케이션을 표현하는 스타일 */
        .loc-disabled {
            background-color: #f8f9fa;
            color: #6c757d;
            border: 1px solid #dee2e6;
            text-decoration: line-through;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">

    <div class="py-5 text-center">
        <h2>로케이션 배치 등록</h2>
        <p class="text-muted">창고, 구역, 행, 열을 선택하면 등록 가능한 단(Level) 목록이 아래에 표시됩니다.</p>
    </div>

    <form th:action th:object="${locationForm}" method="post" id="location-form">
        <div class="row">
            <div class="col-md-3 mb-3">
                <label th:for="warehouseId" class="form-label fw-bold">창고 선택</label>
                <select th:field="*{warehouseId}" id="warehouseId" class="form-select">
                    <option value="">== 창고를 선택하세요 ==</option>
                    <option th:each="w : ${warehouseList}" th:value="${w.id}" th:text="${w.name}">제1창고</option>
                </select>
            </div>

            <div class="col-md-3 mb-3">
                <label th:for="zone" class="form-label fw-bold">구역 (Zone)</label>
                <select th:field="*{zone}" id="zone" class="form-select">
                    <option value="">== 구역 선택 ==</option>
                    <option th:each="zone : ${locationZone}" th:value="${zone}" th:text="${zone.description}">상온</option>
                </select>
            </div>

            <div class="col-md-3 mb-3">
                <label th:for="row" class="form-label fw-bold">행 (Row)</label>
                <select th:field="*{row}" id="row" class="form-select">
                    <option value="">== 행 선택 ==</option>
                    <option th:each="i : ${#numbers.sequence(1, 10)}"
                            th:value="${#numbers.formatInteger(i, 2)}"
                            th:text="${#numbers.formatInteger(i, 2)}">01</option>
                </select>
            </div>

            <div class="col-md-3 mb-3">
                <label th:for="col" class="form-label fw-bold">열 (Col)</label>
                <select th:field="*{col}" id="col" class="form-select">
                    <option value="">== 열 선택 ==</option>
                    <option th:each="i : ${#numbers.sequence(1, 10)}"
                            th:value="${#numbers.formatInteger(i, 2)}"
                            th:text="${#numbers.formatInteger(i, 2)}">01</option>
                </select>
            </div>
        </div>

        <div id="grid-section" class="card my-4 d-none">
            <div class="card-header bg-light d-flex justify-content-between align-items-center">
                <span class="fw-bold text-secondary">📍 생성 예정 로케이션 주소 리스트</span>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-select-all">전체 선택</button>
            </div>
            <div class="card-body">
                <div class="row row-cols-2 row-cols-md-4 g-3" id="location-grid-container">
                </div>
            </div>
        </div>

        <hr class="my-4">
        <div class="row">
            <div class="col">
                <a th:href="@{/admin/locations}" class="w-100 btn btn-secondary btn-lg">이전으로</a>
            </div>
            <div class="col">
                <button class="w-100 btn btn-primary btn-lg" type="submit" id="submit-btn" disabled>선택한 로케이션 등록</button>
            </div>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const warehouseId = document.getElementById('warehouseId');
        const zone = document.getElementById('zone');
        const row = document.getElementById('row');
        const col = document.getElementById('col');

        const gridSection = document.getElementById('grid-section');
        const gridContainer = document.getElementById('location-grid-container');
        const submitBtn = document.getElementById('submit-btn');
        const btnSelectAll = document.getElementById('btn-select-all');

        // 모든 필수 항목이 채워졌는지 감시하고 API를 호출하는 함수
        function fetchAvailableLocations() {
            if (!warehouseId.value || !zone.value || !row.value || !col.value) {
                gridSection.classList.add('d-none');
                submitBtn.disabled = true;
                return;
            }

            // 💡 select 박스로 바꿨으니 padStart는 주석 처리하거나 빼도 되지만, 안전장치로 유지
            const formattedRow = row.value.padStart(2, '0');
            const formattedCol = col.value.padStart(2, '0');
            row.value = formattedRow;
            col.value = formattedCol;

            // ⏳ [로딩 시작] 바둑판 영역을 미리 노출하고 내부에 부트스트랩 스피너를 띄웁니다.
            gridSection.classList.remove('d-none');
            btnSelectAll.style.display = 'none'; // 로딩 중에는 전체선택 버튼 잠시 숨기기
            submitBtn.disabled = true;           // 로딩 중에는 등록 버튼 방어

            // 뼈대 container 전체를 정중앙 로딩 스피너 마크업으로 덮어버립니다.
            gridContainer.innerHTML = `
            <div class="col-12 text-center py-5" id="loc-spinner">
                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <div class="mt-2 text-secondary fw-bold">등록 가능한 로케이션 조회 중...</div>
            </div>
        `;

            const url = `/admin/api/locations/check-loc-code?warehouseId=${warehouseId.value}&zone=${zone.value}&row=${formattedRow}&col=${formattedCol}`;

            // 💡 실무 체감을 위해 너무 빨리 부르면 스피너가 안 보일 수 있으니
            // 0.3초(300ms) 정도 디레이를 걸고 fetch를 날리면 유저 경험(UX)상 훨씬 자연스럽게 출렁입니다.
            setTimeout(() => {
                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        // 🔄 성공하면 이 안에서 gridContainer.innerHTML = '' 로 스피너를 알아서 밀어버립니다.
                        renderGrid(data, zone.value, formattedRow, formattedCol);
                    })
                    .catch(err => {
                        console.error("데이터 로드 실패:", err);
                        gridContainer.innerHTML = `
                        <div class="col-12 text-center py-4 text-danger fw-bold">
                            ❌ 데이터를 불러오는 도중 오류가 발생했습니다.
                        </div>
                    `;
                    });
            }, 500);
        }

        function renderGrid(locationList, zoneVal, rowVal, colVal) {
            gridContainer.innerHTML = ''; // 🧼 여기서 로딩 스피너가 싹 지워집니다!
            gridSection.classList.remove('d-none');
            btnSelectAll.style.display = 'block'; // 전체선택 버튼 다시 복구
            submitBtn.disabled = false;

            locationList.forEach(loc => {
                const colDiv = document.createElement('div');
                colDiv.className = 'col';

                if (loc.registered) {
                    // [이미 등록된 단] - 비활성화 및 취소선
                    colDiv.innerHTML = `
                    <div class="p-3 rounded text-center loc-disabled">
                        <span class="d-block small text-muted">${zoneVal}-${rowVal}-${colVal}-${loc.level}</span>
                        <strong class="text-danger small">이미 등록됨</strong>
                    </div>
                `;
                } else {
                    // [등록 가능한 단] - 체크박스로 선택 가능
                    colDiv.innerHTML = `
                    <div class="p-3 rounded text-center border bg-white shadow-sm h-100">
                        <input type="checkbox" class="form-check-input me-2 loc-checkbox"
                               name="selectedLevels" value="${loc.level}" id="chk-${loc.level}">
                        <label class="form-check-label fw-bold" for="chk-${loc.level}">
                            ${zoneVal}-${rowVal}-${colVal}-${loc.level}
                        </label>
                        <span class="d-block text-success small mt-1">생성 가능</span>
                    </div>
                `;
                }
                gridContainer.appendChild(colDiv);
            });

            // 체크박스가 하나도 선택 안 되었을 때를 위해 이벤트 바인딩 호출
            toggleSubmitButtonState();
        }

        function toggleSubmitButtonState() {
            const checkboxes = document.querySelectorAll('.loc-checkbox');
            const checkedCount = document.querySelectorAll('.loc-checkbox:checked').length;

            submitBtn.disabled = (checkedCount === 0);
            btnSelectAll.innerText = (checkboxes.length === checkedCount && checkboxes.length > 0) ? '선택 해제' : '전체 선택';
        }

        // 이벤트 리스너 등록 (값이 바뀔 때마다 실시간 새로고침)
        warehouseId.addEventListener('change', fetchAvailableLocations);
        zone.addEventListener('change', fetchAvailableLocations);
        row.addEventListener('change', fetchAvailableLocations); // 💡 아까 수정한 대로 change로 유지!
        col.addEventListener('change', fetchAvailableLocations); // 💡 아까 수정한 대로 change로 유지!

        // 동적으로 생성된 체크박스 클릭 감지
        gridContainer.addEventListener('change', function(e) {
            if (e.target.classList.contains('form-check-input')) {
                toggleSubmitButtonState();
            }
        });

        // 전체 선택 / 해제 버튼 기능
        btnSelectAll.addEventListener('click', function() {
            const checkboxes = document.querySelectorAll('.loc-checkbox');
            const checkedCount = document.querySelectorAll('.loc-checkbox:checked').length;

            const shouldCheck = (checkedCount < checkboxes.length);
            checkboxes.forEach(chk => chk.checked = shouldCheck);
            toggleSubmitButtonState();
        });

        // 폼 제출 전 체크박스 검증
        document.getElementById('location-form').addEventListener('submit', function(e) {
            const checkedCount = document.querySelectorAll('.loc-checkbox:checked').length;
            if (checkedCount === 0) {
                e.preventDefault();
                alert('등록할 단(Level)을 최소 하나 이상 선택해 주세요.');
            }
        });
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로케이션 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">

    <div class="py-5 text-center">
        <h2>📌 로케이션 현황 목록</h2>
    </div>

    <!-- 검색 필터 (선택 사항) -->
    <div class="filter-section" style="margin-bottom: 20px;">
        <form th:action="@{/location/list}" method="get" class="form-inline">
            <input type="text" name="itemName" placeholder="로케이션 검색" class="form-control mb-3">
            <button type="submit" class="btn btn-secondary">검색</button>
        </form>
    </div>

    <div class="row">
        <div class="col">
            <button class="btn btn-primary float-end mb-3"
                    th:onclick="|location.href='@{/location/new}'|" type="button">로케이션 등록</button>
        </div>
    </div>

    <table class="table table-hover border">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>소속 창고</th>
            <th>구역(Zone)</th>
            <th>로케이션명</th>
            <th>사용 여부</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <!-- 데이터가 없는 경우 -->
        <tr th:if="${#lists.isEmpty(locationList)}">
            <td colspan="6" class="text-center text-muted">등록된 로케이션이 없습니다.</td>
        </tr>

        <!-- 데이터 반복 출력 -->
        <tr th:each="loc : ${locationList}">
            <td th:text="${loc.id}">1</td>
            <td><span class="badge bg-info text-dark" th:text="${loc.warehouseName}">부산창고</span></td>
            <td th:text="${loc.zone}">ZONE_A</td>
            <td th:text="${loc.locCode}">A-1-1</td>
            <td>
                <span th:if="${loc.useYn.name() == 'Y'}" class="text-success">사용중</span>
                <span th:if="${loc.useYn.name() == 'N'}" class="text-danger">미사용</span>
            </td>
            <td>
                <a th:href="@{/location/detail/{id}(id=${loc.id})}" class="btn btn-sm btn-outline-secondary">상세정보</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로케이션 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-5">

    <!-- 🎛️ 상단 물류 통합 대시보드 탭 -->
    <div class="card p-2 mb-4 shadow-sm bg-white">
        <ul class="nav nav-pills nav-fill">
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/warehouses/list}">🏢 사용가능 창고 조회</a></li>
            <li class="nav-item"><a class="nav-link active bg-dark" th:href="@{/location/list}">📍 로케이션(랙) 현황</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/items/list}">📦 등록가능 상품 조회</a></li>
            <li class="nav-item"><a class="nav-link text-dark fw-bold" th:href="@{/stocks/list}">📜 재고 조회 및 등록</a></li>
        </ul>
    </div>

    <div class="py-5 text-center">
        <h2>📌 로케이션 현황 목록</h2>
    </div>

    <!-- 검색 필터 (선택 사항) -->
    <div class="card shadow-sm bg-white p-3 mb-4">
        <form th:action="@{/location/list}" method="get" id="search-form" class="row g-3 align-items-center">

            <!-- 1. 소속 창고 타겟 필터 (특정 창고의 내부만 파고들 때 핵심) -->
            <div class="col-md-3">
                <label class="form-label small fw-bold text-secondary">소속 창고 시설 필터</label>
                <select th:field="${cond.warehouseId}" name="warehouseId" class="form-select form-select-sm">
                    <option value="">전체 창고 인프라 보기</option>
                    <!-- 백엔드에서 창고 리스트를 함께 넘겨주어 동적으로 뿌려주면 가장 좋습니다 -->
                    <option th:each="wh : ${warehouseList}" th:value="${wh.id}" th:text="${wh.name}" th:selected="${cond.warehouseId == wh.id}">서울 제1창고</option>
                </select>
            </div>

            <!-- 2. 특정 존 필터 -->
            <div class="col-md-3">
                <label class="form-label small fw-bold text-secondary">배정 존(Zone) 검색</label>
                <select th:field="${cond.zone}" name="warehouseId" class="form-select form-select-sm">
                    <option value="">전체 구역 보기</option>
                    <!-- 백엔드에서 창고 리스트를 함께 넘겨주어 동적으로 뿌려주면 가장 좋습니다 -->
                    <option th:each="z : ${zoneList}" th:value="${z.name}" th:text="${z.description}" th:selected="${cond.zone?.name() == z.name}">냉장</option>
                </select>
            </div>

            <!-- 3. Loc_code 직접 입력 검색 -->
            <div class="col-md-5">
                <label class="form-label small fw-bold text-secondary">배정 존(Zone) 검색</label>
                <input type="text" th:field="${cond.locCode}" name="locCode" class="form-control form-control-sm" placeholder="loc_code 입력">
            </div>

            <div class="col-md-1 align-self-end">
                <button type="submit" class="btn btn-dark btn-sm w-100 fw-bold">조회</button>
            </div>
        </form>
    </div>

    <div class="d-flex justify-content-end gap-2 mb-3">
        <a class="btn btn-secondary"
                href="/user/home">이전</a>
    </div>

    <table class="table table-hover border">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>소속 창고</th>
            <th>구역(Zone)</th>
            <th>Loc_code</th>
            <th>사용 여부</th>
        </tr>
        </thead>
        <tbody>
        <!-- 데이터가 없는 경우 -->
        <tr th:if="${#lists.isEmpty(page.getContent())}">
            <td colspan="6" class="text-center text-muted">등록된 로케이션이 없습니다.</td>
        </tr>

        <!-- 데이터 반복 출력 -->
        <tr th:each="loc : ${page.getContent()}">
            <td th:text="${loc.id}">1</td>
            <td th:text="${loc.warehouseName}">서울 제1중앙물류창고</td>
            <td>
                <span th:if="${loc.zone.name() == 'COLD'}" class="badge bg-info-subtle text-info fw-bold">냉동구역</span>
                <span th:if="${loc.zone.name() == 'FRIDGE'}" class="badge bg-success-subtle text-success fw-bold">냉장구역</span>
                <span th:if="${loc.zone.name() == 'ROOM'}" class="badge bg-secondary-subtle text-secondary fw-bold">상온구역</span>
                <span th:if="${loc.zone.name() == 'HAZARD'}" class="badge bg-danger-subtle text-danger fw-bold">위험구역</span>
            </td>
            <td th:text="${loc.locCode}">A-1-1</td>
            <td>
                <span th:if="${loc.useYn.name() == 'Y'}" class="text-success">사용중</span>
                <span th:if="${loc.useYn.name() == 'N'}" class="text-danger">미사용</span>
            </td>
        </tr>
        </tbody>
    </table>
    <div th:replace="~{fragments/navbar :: pagingBar(${page})}"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
